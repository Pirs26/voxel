[workspace]
resolver = "3"
members = [
    "crates/voxel-core",
    "crates/voxel-acoustics",
    "crates/voxel-audio-dsp",
    "crates/voxel-net",
    "crates/voxel-updater",
    "crates/game",
]

[workspace.package]
version = "0.2.0-rc.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glam = { version = "0.33.2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.10"
noise = "0.9"
cpal = "0.18"
rtrb = "0.4"
postcard = { version = "1.2", features = ["alloc"] }
iroh = "1.5"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
bytes = "1"
data-encoding = "2"
rusty-opus = "1.2"
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
sha2 = "0.11"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "x11",
    "wayland",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_material",
    "bevy_shader",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_text",
    "default_font",
    "bevy_picking",
    "ui_picking",
    "tonemapping_luts",
    "smaa_luts",
    "zstd_rust",
] }

# Internal workspace crates
voxel-core = { path = "crates/voxel-core" }
voxel-acoustics = { path = "crates/voxel-acoustics" }
voxel-audio-dsp = { path = "crates/voxel-audio-dsp" }
voxel-net = { path = "crates/voxel-net" }
voxel-updater = { path = "crates/voxel-updater" }

# Fast runtime performance & compact dev binaries (avoids >2GB PE limit on windows-gnu!)
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
