name: Build & Release (macOS, Windows, Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_name:
        description: "Optional label for manual build artifacts"
        required: false
        default: "dev-build"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            bin_name: game
            archive: echoes-below-macos-arm64.zip
          - name: windows-x64
            os: windows-latest
            bin_name: game.exe
            archive: echoes-below-windows-x64.zip
          - name: linux-x64
            os: ubuntu-latest
            bin_name: game
            archive: echoes-below-linux-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux audio & windowing dev libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run workspace unit tests (release profile to share cache with build)
        run: cargo test --release --workspace --exclude game

      - name: Build release binary
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: cargo build --release -p game

      - name: Package release archive (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/echoes-below
          cp target/release/${{ matrix.bin_name }} dist/echoes-below/echoes-below
          cp -R assets dist/echoes-below/assets
          (cd dist && zip -r ../${{ matrix.archive }} echoes-below)

      - name: Package release archive (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/echoes-below
          cp target/release/${{ matrix.bin_name }} dist/echoes-below/echoes-below
          cp -R assets dist/echoes-below/assets
          tar -czf ${{ matrix.archive }} -C dist echoes-below

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\echoes-below | Out-Null
          Copy-Item target\release\${{ matrix.bin_name }} dist\echoes-below\echoes-below.exe
          Copy-Item -Recurse assets dist\echoes-below\assets
          Compress-Archive -Path dist\echoes-below -DestinationPath ${{ matrix.archive }} -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.archive }}

  publish_release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform archives
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          (cd release-artifacts && sha256sum echoes-below-windows-x64.zip echoes-below-macos-arm64.zip echoes-below-linux-x64.tar.gz > SHA256SUMS.txt)
          cat release-artifacts/SHA256SUMS.txt

      - name: Classify Big Release (vX.Y / vX.Y.0) vs Pre-release (vX.Y.Z)
        id: classify
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+(\.0)?$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.classify.outputs.prerelease }}
          make_latest: ${{ steps.classify.outputs.make_latest }}
          generate_release_notes: true
          files: release-artifacts/*
